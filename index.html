<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | PureScent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <script src="Tailwind/browser@4.js"></script>
</head>
<body>
    <header class="w-auto h-[60px] m-5">
        <nav class="w-full h-full bg-black/90 flex justify-around items-center rounded-2xl">
            <ul>
                <li><a href="index.html" class="font-[manrope] text-2xl text-white font-bold">PureScent</a></li>
            </ul>

            <ul class="flex gap-6">
                <li><a href="" class="font-[Montserrat] font-medium text-white">Home</a></li>
                <li><a href="" class="font-[Montserrat] font-medium text-white">Shop</a></li>
                <li><a href="" class="font-[Montserrat] font-medium text-white">Collections</a></li>
                <li><a href="" class="font-[Montserrat] font-medium text-white">About</a></li>
                <li><a href="" class="font-[Montserrat] font-medium text-white">Contact</a></li>
            </ul>

            <ul class="flex gap-6">
                <li><button><i class="fa-solid fa-magnifying-glass text-[19px] text-white"></i></button></li>
                <li><button><i class="fa-solid fa-user text-[18px] text-white"></i></button></li>
                <li><button><i class="fa-solid fa-cart-shopping text-[18px] text-white"></i></button></li>
            </ul>
        </nav>
    </header>

    <main class="m-5 w-auto my-10">
        <section>
            <div id="default-carousel" class="relative w-full" data-carousel="slide">
                <div class="relative h-[450px] md:h-[550px] lg:h-[600px] overflow-hidden rounded-2xl shadow-xl">

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="assets/img/Carousel_Main.png" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
                    </div>

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="assets/img/PureScnet_5.png" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
                    </div>

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="assets/img/PureScnet_8.png" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
                    </div>

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="assets/img/PureScnet_7.png" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
                    </div>

                    <div class="hidden duration-700 ease-in-out" data-carousel-item>
                        <img src="assets/img/PureScnet_2.png" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
                    </div>
                </div>


                <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="true" aria-label="Slide 1" data-carousel-slide-to="0"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 2" data-carousel-slide-to="1"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 3" data-carousel-slide-to="2"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 4" data-carousel-slide-to="3"></button>
                    <button type="button" class="w-3 h-3 rounded-full" aria-current="false" aria-label="Slide 5" data-carousel-slide-to="4"></button>
                </div>


                <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-base bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-black/80 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none rounded-full">
                        <svg class="w-5 h-5 text-white rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/></svg>
                        <span class="sr-only">Previous</span>
                    </span>
                </button>

                <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-next>
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-base bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-black/80 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none rounded-full">
                        <svg class="w-5 h-5 text-white rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/></svg>
                        <span class="sr-only">Next</span>
                    </span>
                </button>
            </div>  
        </section>

        <section class="m-5 w-auto">
            <div class="w-full flex flex-col justify-center items-center">
                <div class="hidden bg-black h-1 w-[50%]"></div>
                <h3 class="my-6 font-[Montserrat] text-3xl font-semibold text-black/80">Best Sellers</h3>
                <!-- <span><i class="fa-solid fa-angles-down"></i></span> -->
                <div class="hidden bg-black h-1 w-[50%]"></div>
            </div>

            <div id="output" class="w-full grid grid-cols-4 gap-x-[100px] gap-y-[40p] justify-center justify-items-center my-10">
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>
    <script src="javascript/script.js"></script>
</body>
</html>
